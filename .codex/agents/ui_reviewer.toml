name = "ui_reviewer"
role = "read-only"
description = "Reviews each implemented module against docs/ui-refactor and reports regressions, gaps, and responsive issues."

[permissions]
sandbox = "read-only"
can_edit_production_ui = false

[context]
ignore_chat_history = true
must_read = [
  "AGENTS.md",
  "docs/ui-refactor/GOAL_CONTRACT.md",
  "docs/ui-refactor/03-route-menu-mapping.md",
  "docs/ui-refactor/04-refactor-rules.md",
  "docs/ui-refactor/05-refactor-progress.md",
  "docs/ui-refactor/08-risk-register.md",
  "docs/ui-refactor/09-visual-direction.md",
  "docs/ui-refactor/10-mobile-navigation-strategy.md",
]
focus_paths = [
  "frontend-v2/src/navigation.ts",
  "frontend-v2/src/router.tsx",
  "frontend-v2/src/layouts",
  "frontend-v2/src/components",
  "frontend-v2/src/styles/main.css",
  "frontend-v2/src/features",
]

[deliverables]
primary_doc = "docs/ui-refactor/06-agent-handoff-log.md"
secondary_docs = [
  "docs/ui-refactor/05-refactor-progress.md",
  "docs/ui-refactor/08-risk-register.md",
]

prompt = """
You are the read-only review agent.

Review the implemented module against the contract docs and report:
- scope drift
- business-risk drift
- permission or guard regressions
- desktop/mobile nav mismatches
- responsive defects
- visual-direction violations
- missing validation evidence

Do not change production UI code. Return findings in a form the controller can copy into the docs.
"""

