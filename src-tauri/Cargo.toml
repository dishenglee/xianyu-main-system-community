[package]
name = "xianyu-tauri"
version = "0.1.54"
edition = "2021"
default-run = "xianyu-tauri"

# Mobile (Android/iOS) requires a cdylib/staticlib so the Android Gradle
# project + xcframework can link it. Desktop still uses the binary target.
[lib]
name = "xianyu_tauri_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "xianyu-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
devtools = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
xianyu-rust-backend-full = { path = ".." }
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "=2.3.3"
aes-gcm = "0.10"
argon2 = "0.5"
fast_qr = { version = "0.12", features = ["svg"] }
url = "2"
libsqlite3-sys = "0.30.1"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
mac_address = "1.1"
once_cell = "1"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.4.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[dev-dependencies]
tempfile = "3"
